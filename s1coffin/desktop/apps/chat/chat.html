<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天启通</title>
    <link rel="stylesheet" href="chat-style.css">
</head>
<body>

    <!-- ========== 登录页 ========== -->
    <div class="login-view" id="loginView">
        <div class="login-brand">
            <div class="login-logo">💬</div>
            <div class="login-title">天启通</div>
            <div class="login-subtitle">Tianqi Chat · 内部通讯</div>
        </div>

        <!-- 中间区：表单和载入圈绝对定位叠放 -->
        <div class="login-stage">
        <form class="login-form" id="loginForm" autocomplete="off" onsubmit="return false;">
            <input type="text" id="loginEmpId" placeholder="工号" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="off">
            <button type="button" class="login-btn" id="loginBtn">登 录</button>
            <div class="login-error" id="loginError"></div>
        </form>

            <div class="login-loading hidden" id="loginLoading">
                <div class="connecting-spinner"></div>
                <div class="connecting-text">正在连接</div>
            </div>
        </div>

        <div class="login-footer">内测版本 v0.9 · 仅限内部使用</div>
    </div>

    <!-- ========== 聊天页 ========== -->
    <div class="chat-view hidden" id="chatView">
        <div class="chat-sidebar">
            <!-- 用户信息 -->
            <div class="sidebar-user" id="sidebarUser"></div>

            <!-- 搜索 + 添加 -->
            <div class="sidebar-search">
                <input type="text" placeholder="搜索" id="contactSearch" autocomplete="off">
                <button class="sidebar-add-btn" id="addBtn" title="添加">＋</button>
                <div class="add-dropdown hidden" id="addDropdown">
                    <div class="add-dropdown-item" data-action="import">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        同步记录
                    </div>
                    <div class="add-dropdown-item" data-action="addfriend">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                        添加好友
                    </div>
                </div>
            </div>

            <!-- 联系人列表 -->
            <div class="sidebar-contacts" id="contactList"></div>

            <!-- 底部信息 -->
            <div class="sidebar-bottom">
                <div class="sidebar-bottom-info">
                    <div class="network-status">
                        <span class="status-label">网络状态</span>
                        <span class="status-dot"></span>
                        <span class="status-value">稳定</span>
                    </div>
                    <div class="network-node">当前节点 · 西延总部</div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="退出登录">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 右侧聊天区 -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-header-avatar" id="chatHeaderAvatar">👤</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chatHeaderName">联系人</div>
                    <div class="chat-header-role" id="chatHeaderRole"></div>
                </div>
                <button class="chat-date-search-btn" id="dateSearchBtn" title="查找日期">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <div class="date-dropdown hidden" id="dateDropdown"></div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area">
                <div class="choice-buttons hidden" id="choiceButtons"></div>
                <div class="chat-input-row">
                    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                    <button class="send-btn" id="sendBtn">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 通用弹窗 ========== -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-content" id="modalContent"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

        <!-- ========== 安全锁定遮罩 ========== -->
        <div class="lock-overlay hidden" id="lockOverlay">
            <div class="lock-modal">
                <div class="lock-modal-title">安全警告</div>
                <div class="lock-modal-text">监测到非法登录行为，账号已被锁定。</div>
                <button class="lock-modal-btn" onclick="exitLockedChat()">退 出</button>
            </div>
        </div>    

    <script src="chat-data.js"></script>
    <script src="chat-sfx.js"></script>
    <script src="chat-mystery.js"></script>
    <script src="chat-script.js"></script>
</body>
</html>
