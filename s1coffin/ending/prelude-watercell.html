<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多维实体 · 水牢</title>
    <script src="../desktop/js/playtime.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            /* 暖冷融合背景：左上金黄 → 右下青蓝 */
            background:
                radial-gradient(ellipse 80% 60% at 18% 12%, rgba(220, 185, 120, 0.28) 0%, transparent 65%),
                radial-gradient(ellipse 90% 70% at 82% 88%, rgba(60, 130, 190, 0.20) 0%, transparent 65%),
                linear-gradient(150deg, #f6f0e0 0%, #eef1f4 50%, #e4edf5 100%);
            color: #0a1a2e;
            font-family: 'Source Han Serif SC', 'Source Han Serif CN', 'Noto Serif SC', 'Songti SC', 'STZhongsong', Georgia, serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-serif: 'Source Han Serif SC', 'Source Han Serif CN', 'Noto Serif SC', 'Songti SC', 'STZhongsong', Georgia, serif;
        }

        /* ========== 静态网格底纹（科技感） ========== */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(60, 130, 190, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(60, 130, 190, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 90%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 90%);
        }

        /* ========== 背景六边形 ========== */
        .hex-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .hex-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vmax;
            height: 100vmax;
            margin-top: -50vmax;
            margin-left: -50vmax;
            /* 深青蓝，和背景的暖金形成对比，六边形更醒目 */
            color: rgba(35, 100, 155, 0.55);
            transform-origin: center center;
            animation: hexExpand 16s linear infinite;
            animation-fill-mode: backwards;
            will-change: transform, opacity;
            /* 三层光晕：内圈青蓝 + 外圈淡金，融合两种色系 */
            filter:
                drop-shadow(0 0 8px rgba(35, 100, 155, 0.2))
                drop-shadow(0 0 24px rgba(180, 150, 90, 0.08));
        }

        .hex-shape svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hex-shape polygon {
            fill: none;
            stroke: currentColor;
            /* 描边加粗，更明显 */
            stroke-width: 1.1;
            vector-effect: non-scaling-stroke;
        }

        @keyframes hexExpand {
            0%   { transform: scale(0.05); opacity: 0; }
            8%   { opacity: 0.55; }
            50%  { opacity: 0.4; }
            90%  { opacity: 0.06; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .hex-shape:nth-child(1) { animation-delay: 0s; }
        .hex-shape:nth-child(2) { animation-delay: 4s; }
        .hex-shape:nth-child(3) { animation-delay: 8s; }
        .hex-shape:nth-child(4) { animation-delay: 12s; }

        /* ========== 背景粒子 ========== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            /* 暖金色粒子，呼应结局页 */
            background: rgba(170, 140, 90, 0.55);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0%   { transform: translate(0, 105vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.5; }
            50%  { transform: translate(26px, 55vh) rotate(180deg); opacity: 0.7; }
            90%  { opacity: 0.4; }
            100% { transform: translate(-14px, -8vh) rotate(360deg); opacity: 0; }
        }

        /* ========== 中心内容 ========== */
        .title-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 40px;
            max-width: 720px;
            width: 100%;
        }

        .title-inner {
            text-align: center;
        }

        /* 主标题 —— 深墨蓝，沉稳 */
        .game-title {
            font-family: var(--font-sans);
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.05;
            color: #0a3a5a;
            text-shadow:
                0 2px 20px rgba(35, 100, 155, 0.28),
                0 0 60px rgba(35, 100, 155, 0.15);
            opacity: 0;
            animation: titleReveal 1.2s ease 0.8s forwards;
        }

        @keyframes titleReveal {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* 英文副标题 */
        .game-subtitle {
            font-family: var(--font-sans);
            text-align: center;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2.2em;
            color: #4a6a8a;
            margin-top: 18px;
            padding-left: 2.2em;
            user-select: none;
            text-shadow: 0 0 20px rgba(60, 130, 190, 0.22);
        }

        .game-subtitle .sub-char {
            display: inline-block;
            opacity: 0;
            will-change: opacity, filter, transform;
            animation: subtitleCharIn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes subtitleCharIn {
            0%   { opacity: 0; filter: blur(12px); transform: translateY(20px) scale(0.7); }
            60%  { opacity: 1; filter: blur(2px); transform: translateY(-4px) scale(1.05); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
        }

        /* 副标题（水牢）—— 金蓝混搭 */
        .series-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 26px;
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            color: #0a5a8a;
            letter-spacing: 0.5em;
            user-select: none;
        }

        .series-mark .mark-line {
            display: inline-block;
            width: 36px;
            height: 1px;
            /* 纯青蓝渐变，两端透明，中间实色 */
            background: linear-gradient(90deg, transparent, #0a5a8a 50%, transparent);
            opacity: 0;
            transform: scaleX(0);
            will-change: transform, opacity;
        }

        .series-mark .mark-line:first-child {
            transform-origin: right center;
            animation: markLineExpand 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 2.1s forwards;
        }

        .series-mark .mark-line:last-child {
            transform-origin: left center;
            animation: markLineExpand 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 2.1s forwards;
        }

        @keyframes markLineExpand {
            from { transform: scaleX(0); opacity: 0; }
            to   { transform: scaleX(1); opacity: 0.9; }
        }

        .series-mark .mark-text {
            display: inline-block;
            padding-left: 0.5em;
            opacity: 0;
            /* 文字：青蓝主光 + 金色副光 */
            text-shadow:
                0 0 10px rgba(10, 90, 138, 0.75),
                0 0 24px rgba(10, 90, 138, 0.4),
                0 0 48px rgba(168, 128, 64, 0.25);
            animation: markTextReveal 1.2s ease 2.4s forwards;
        }

        @keyframes markTextReveal {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 敬请期待小字 */
        .coming-soon {
            margin-top: 52px;
            font-family: var(--font-serif);
            font-size: 13px;
            letter-spacing: 0.4em;
            color: #7a8fa0;
            padding-left: 0.4em;
            opacity: 0;
            animation: fadeIn 1.6s ease 3.9s forwards;
        }

        /* 按钮 */
        .action-area {
            margin-top: 48px;
            display: flex;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 1.4s ease 4.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .btn {
            display: inline-block;
            padding: 12px 36px;
            padding-left: calc(36px + 0.2em);
            font-size: 14px;
            font-family: var(--font-serif);
            font-weight: 500;
            letter-spacing: 0.2em;
            color: #0a5a8a;
            background: transparent;
            border: 1px solid rgba(10, 90, 138, 0.5);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease, border-color 0.3s ease,
                        color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .btn:hover {
            background: rgba(10, 90, 138, 0.08);
            border-color: #0a5a8a;
            color: #003a5c;
            box-shadow: 0 4px 20px rgba(10, 90, 138, 0.2),
                        0 4px 24px rgba(168, 128, 64, 0.1);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(10, 90, 138, 0.12);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:hover::after {
            width: 300px;
            height: 300px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 680px) {
            .game-title { font-size: 2.6rem; }
            .series-mark { font-size: 20px; }
            .coming-soon { font-size: 12px; margin-top: 42px; }
        }
    </style>
</head>
<body>

    <!-- 静态网格底纹 -->
    <div class="grid-overlay"></div>

    <!-- 背景六边形 -->
    <div class="hex-layer">
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
    </div>

    <!-- 背景粒子 -->
    <div class="particles" id="particles"></div>

    <!-- 中心内容 -->
    <div class="title-container">
        <div class="title-inner">
            <h1 class="game-title">多维实体</h1>
            <p class="game-subtitle">Dimension</p>
            <div class="series-mark">
                <span class="mark-line"></span>
                <span class="mark-text">水 牢</span>
                <span class="mark-line"></span>
            </div>
            <p class="coming-soon">新 作 将 至 · 敬 请 期 待</p>
            <div class="action-area">
                <div class="btn" id="btnBack">回 到 桌 面</div>
            </div>
        </div>
    </div>

<script>
/* ============================================================
   记录：玩家打开过水牢预告页
   ============================================================ */
localStorage.setItem('watercell_visited', 'true');

/* ============================================================
   背景粒子
   ============================================================ */
(function initParticles() {
    const container = document.getElementById('particles');
    const count = 50;
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random() * 100) + '%';
        const dur = 16 + Math.random() * 14;
        p.style.animationDuration = dur + 's';
        p.style.animationDelay = (-Math.random() * dur) + 's';
        const size = (1.5 + Math.random() * 2.5).toFixed(1) + 'px';
        p.style.width = size;
        p.style.height = size;
        p.style.opacity = (0.3 + Math.random() * 0.35).toFixed(2);
        container.appendChild(p);
    }
})();

/* ============================================================
   英文副标题逐字拆分
   ============================================================ */
(function initSubtitle() {
    const el = document.querySelector('.game-subtitle');
    if (!el) return;
    const text = el.textContent.trim();
    el.textContent = '';
    [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'sub-char';
        span.textContent = ch;
        span.style.animationDelay = (1.0 + i * 0.08) + 's';
        el.appendChild(span);
    });
})();

/* ============================================================
   Opening 音乐
   ============================================================ */
const openingAudio = new Audio('/music/opening.mp3');
openingAudio.volume = 1;
openingAudio.loop = false;

setTimeout(() => {
    openingAudio.play().catch(() => {
        document.addEventListener('click', function resumeOnce() {
            openingAudio.currentTime = 0;
            openingAudio.play().catch(() => {});
            document.removeEventListener('click', resumeOnce);
        }, { once: true });
    });
}, 800);

/* ============================================================
   回到桌面
   ============================================================ */
// 检查是否回顾模式
const isReview = new URLSearchParams(window.location.search).get('review') === 'true';
const btnBack = document.getElementById('btnBack');

if (isReview) {
    // 回顾模式：隐藏"回到桌面"按钮
    btnBack.style.display = 'none';
} else {
    // 正常模式：绑定点击事件
    btnBack.addEventListener('click', (e) => {
        e.stopPropagation();
        // 和葬礼页的"时光回溯"一样，返回桌面后弹一次成就通知
        localStorage.setItem('achievement_hint_pending', 'true');
        window.location.href = '../desktop/index-hanxiu.html';
    });
}
</script>
</body>
</html>
