<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线上综合能力评估 · 天启科技</title>
<script src="../desktop/js/playtime.js"></script>
<style>
/* ========== 让背景色可平滑过渡 ========== */
@property --bg-outer {
    syntax: '<color>';
    initial-value: #0a1628;
    inherits: true;
}
@property --bg-inner {
    syntax: '<color>';
    initial-value: #12243e;
    inherits: true;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

:root {
    --bg-outer: #0a1628; --bg-inner: #12243e;
    --accent: #4a8fd8; --accent-glow: #7ab8ff;
    --accent-soft: rgba(120, 180, 255, 0.15);
    --text-primary: #d5deee; --text-muted: #6a7a95; --text-dim: #4a5a75;
    --hb-duration: 1.0s; --hb-scale: 1.08; --hb-opacity-low: 0.5;
    --hex-opacity: 0.05; --hex-speed: 60s;
}
body {
    background: var(--bg-outer);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 15px; line-height: 1.8;
    transition:
        --bg-outer 2.8s cubic-bezier(0.4, 0, 0.2, 1),
        --bg-inner 2.8s cubic-bezier(0.4, 0, 0.2, 1),
        color 1.5s ease;
    position: relative;
}
body.phase-1 { --bg-outer:#0a1628; --bg-inner:#12243e; --accent:#4a8fd8; --accent-glow:#7ab8ff; --accent-soft:rgba(120,180,255,0.15); --text-primary:#d5deee; --text-muted:#6a7a95; --text-dim:#4a5a75; --hb-duration:1.0s; --hb-scale:1.08; --hb-opacity-low:0.5; --hex-opacity:0.05; --hex-speed:60s; }
body.phase-2 { --bg-outer:#0d1428; --bg-inner:#1a1240; --accent:#7a5cc8; --accent-glow:#a88aff; --accent-soft:rgba(140,100,220,0.15); --text-primary:#d8d0ee; --text-muted:#6a5a95; --text-dim:#4a3a75; --hb-duration:0.75s; --hb-scale:1.14; --hb-opacity-low:0.45; --hex-opacity:0.05; --hex-speed:45s; }
body.phase-3 { --bg-outer:#140a28; --bg-inner:#2a0a40; --accent:#9a4ac8; --accent-glow:#c87aff; --accent-soft:rgba(160,80,220,0.18); --text-primary:#e0d0f0; --text-muted:#7a5a95; --text-dim:#5a3a75; --hb-duration:0.65s; --hb-scale:1.20; --hb-opacity-low:0.4; --hex-opacity:0.03; --hex-speed:35s; }
body.phase-4 { --bg-outer:#1a0505; --bg-inner:#5c0a0a; --accent:#c83030; --accent-glow:#ff5050; --accent-soft:rgba(200,60,60,0.2); --text-primary:#f0d5d5; --text-muted:#a07070; --text-dim:#704545; --hb-duration:0.55s; --hb-scale:1.28; --hb-opacity-low:0.32; --hex-opacity:0.05; --hex-speed:25s; }
body.phase-5 { --bg-outer:#050202; --bg-inner:#2a0a0a; --accent:#c82020; --accent-glow:#ff3030; --accent-soft:rgba(200,30,30,0.22); --text-primary:#e8d0d0; --text-muted:#906060; --text-dim:#603535; --hb-duration:0.45s; --hb-scale:1.4; --hb-opacity-low:0.22; --hex-opacity:0.05; --hex-speed:18s; }

body.phase-result {
    --bg-outer: #0a0a14;
    --bg-inner: #14141f;
    --accent: #4a8fd8;
    --accent-glow: #7ab8ff;
    --accent-soft: rgba(120, 180, 255, 0.15);
    --text-primary: #d5deee;
    --text-muted: #6a7a95;
    --text-dim: #4a5a75;
    --hb-duration: 1.0s;
    --hb-scale: 1.08;
    --hb-opacity-low: 0.5;
    --hex-opacity: 0.05;
    --hex-speed: 60s;
}

#heartbeat-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, var(--bg-inner) 0%, var(--bg-outer) 65%);
    animation: heartbeatPulse var(--hb-duration) ease-in-out infinite;
}
@keyframes heartbeatPulse {
    0%, 100% { opacity: var(--hb-opacity-low); transform: scale(1); }
    50% { opacity: 1; transform: scale(var(--hb-scale)); }
}

#hex-bg {
    position: fixed; top: 50%; left: 50%;
    width: 160vmin; height: 160vmin;
    margin-top: -80vmin; margin-left: -80vmin;
    z-index: 0; pointer-events: none;
    opacity: var(--hex-opacity);
    transition: opacity 2.5s ease;
    transform: rotate(0deg);
    will-change: transform;
}

#progress-rail {
    position: fixed; right: 36px; top: 50%;
    transform: translateY(-50%); z-index: 10;
    display: flex; flex-direction: column;
    gap: 5px; align-items: center;
}
.rail-seg {
    width: 2px; height: 10px;
    background: rgba(255,255,255,0.08); border-radius: 2px;
    transition: all 0.5s ease;
}
.rail-seg.done { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.rail-seg.current {
    width: 4px; height: 16px;
    background: var(--accent-glow);
    box-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent);
    animation: railPulse 1.2s ease-in-out infinite;
}
@keyframes railPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.scene {
    position: fixed; inset: 0; z-index: 5;
    pointer-events: none;
}
.scene-inner {
    position: absolute;
    top: 50%; left: 50%;
    width: calc(100% - 160px);
    max-width: 860px;
    text-align: center;
    pointer-events: auto;
    transform: translate(-50%, -50%);
    transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
}
.scene-inner.pushed-up {
    transform: translate(-50%, calc(-50% - 100px));
}
.scene-inner.exiting {
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.55, 0, 1, 0.45);
    transform: translate(-50%, calc(-50% - 180px));
}

/* ========== 结果页滚动条：暗红定制（防呼吸灯闪烁） ========== */
body.result-mode {
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    /* Firefox：thumb 和 track 都用不透明色 */
    scrollbar-color: #8a2a2a var(--bg-outer);
}

/* Chrome / Edge / Safari */
body.result-mode::-webkit-scrollbar {
    width: 10px;
}

/* 轨道：用当前 phase 的 --bg-outer —— 不透明，和背景外围色一致 */
body.result-mode::-webkit-scrollbar-track {
    background: var(--bg-outer);
    margin: 8px 0;
}

/* 拇指：不透明的暗红渐变 */
body.result-mode::-webkit-scrollbar-thumb {
    background: linear-gradient(
        180deg,
        #8a2a2a 0%,
        #6c2020 100%
    );
    border-radius: 6px;
    border: 2px solid var(--bg-outer);
    background-clip: padding-box;
}

body.result-mode::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(
        180deg,
        #a03434 0%,
        #7a2626 100%
    );
    background-clip: padding-box;
}

body.result-mode::-webkit-scrollbar-corner {
    background: var(--bg-outer);
}

/* 可跳转时：空白区显示手型 */
body.result-mode.can-continue {
    cursor: pointer;
}

/* 卡片和错题区内部：保持默认光标 */
body.result-mode.can-continue .result-body,
body.result-mode.can-continue .result-wrong {
    cursor: default;
}

/* ========== 结果页：允许滚动 ========== */
body.result-mode {
    overflow-y: auto;
    overflow-x: hidden;
}

body.result-mode .scene {
    position: static;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

body.result-mode .scene-inner {
    position: static;
    transform: none;
    transition: none;
    will-change: auto;
    margin: auto;
    width: calc(100% - 160px);
    max-width: 860px;
    padding: 60px 0 100px;
    box-sizing: border-box;
}

body.result-mode .scene-inner.exiting {
    transform: none;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.question-text {
    font-size: 24px; font-weight: 500;
    line-height: 1.7; letter-spacing: 0.02em;
    color: var(--text-primary);
    transition: color 1.2s ease;
    min-height: 1.7em;
}
.question-text .char {
    display: inline-block;
    opacity: 0;
    animation: charIn 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    will-change: transform, opacity;
}
.question-text .char.space { width: 0.4em; }
@keyframes charIn {
    from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.question-text .char.jitter-char {
    animation: charInJitter 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
@keyframes charInJitter {
    0% { opacity: 0; transform: translateY(14px) translateX(3px); filter: blur(4px); }
    35% { opacity: 1; transform: translateY(-4px) translateX(-2px); filter: blur(0.5px); }
    60% { transform: translateY(2px) translateX(2px); }
    80% { transform: translateY(-1px) translateX(-1px); }
    100% { opacity: 1; transform: translateY(0) translateX(0); filter: blur(0); }
}
.question-text .char.emph {
    color: var(--accent-glow);
    font-weight: 800;
    font-size: 1.18em;
    text-shadow:
        0 0 10px var(--accent-glow),
        0 0 24px var(--accent-soft),
        0 0 40px rgba(0, 200, 255, 0.15);
    letter-spacing: 0.04em;
}

.opts-container {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    padding-top: 44px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.75s ease 0.15s,
                transform 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.15s;
    will-change: transform, opacity;
    pointer-events: auto;
}
.opts-container.show {
    opacity: 1;
    transform: translateY(0);
}

.options {
    display: flex; flex-wrap: wrap;
    gap: 12px; justify-content: center;
    max-width: 780px;
    margin: 0 auto;
}
.option {
    position: relative;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 100%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    cursor: pointer; font-size: 14px;
    color: var(--text-primary);
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, color 0.3s, transform 0.3s ease, opacity 0.35s ease;
    opacity: 0;
    animation: optIn 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    user-select: none; white-space: nowrap;
    backdrop-filter: blur(8px);
    will-change: transform, opacity;
}
.option[data-entered="true"] {
    animation: none;
    opacity: 1;
    transform: none;
}
@keyframes optIn {
    from { opacity: 0; transform: translateY(18px); filter: blur(3px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.option:hover {
    background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(255,255,255,0.03) 100%);
    border-color: var(--accent);
    box-shadow: 0 0 24px var(--accent-soft);
}
.option.selected {
    background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(255,255,255,0.04) 100%);
    border-color: var(--accent-glow);
    box-shadow: 0 0 28px var(--accent-soft), inset 0 0 14px rgba(255,255,255,0.05);
    color: #ffffff;
}
.option .opt-dot {
    width: 10px; height: 10px;
    border: 1.5px solid var(--text-dim);
    border-radius: 50%; flex-shrink: 0;
    transition: all 0.25s ease;
}
.option:hover .opt-dot { border-color: var(--accent-glow); }
.option.selected .opt-dot {
    border-color: var(--accent-glow);
    background: var(--accent-glow);
    box-shadow: 0 0 10px var(--accent-glow);
}
.options.multiple .option .opt-dot { border-radius: 3px; }
.option .opt-custom-input {
    margin-left: 6px; padding: 5px 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px;
    color: var(--text-primary); font-size: 12px;
    outline: none; width: 110px; font-family: inherit;
}
.option .opt-custom-input:focus { border-color: var(--accent); }

.option.wrong {
    animation: optWrong 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards !important;
    border-color: #ff3030 !important;
    background: rgba(120, 0, 0, 0.4) !important;
    box-shadow: 0 0 36px rgba(255, 50, 50, 0.65) !important;
    color: #ffb0b0 !important;
}
@keyframes optWrong {
    0%, 100% { transform: translateX(0) scale(1); }
    10% { transform: translateX(-14px) scale(1.03); }
    20% { transform: translateX(14px) scale(0.97); }
    30% { transform: translateX(-11px) scale(1.02); }
    40% { transform: translateX(11px) scale(0.98); }
    50% { transform: translateX(-8px) scale(1.01); }
    60% { transform: translateX(8px) scale(0.99); }
    70% { transform: translateX(-4px) scale(1); }
    100% { transform: translateX(0) scale(1); }
}

.text-input-wrap {
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
}
.text-input {
    width: 100%; max-width: 520px;
    padding: 18px 26px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 17px; font-family: inherit;
    outline: none; text-align: center;
    letter-spacing: 0.06em;
    transition: all 0.3s ease;
    opacity: 0;
    animation: optIn 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
.text-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 28px var(--accent-soft);
    background: rgba(0,0,0,0.5);
}
.text-input::placeholder { color: var(--text-dim); font-size: 14px; letter-spacing: 0; }
.text-input.wrong {
    animation: inputWrong 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    border-color: #ff3030 !important;
    box-shadow: 0 0 36px rgba(255, 50, 50, 0.55) !important;
    background: rgba(80, 0, 0, 0.35) !important;
    color: #ffb0b0;
}
@keyframes inputWrong {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
    20%, 40%, 60%, 80% { transform: translateX(10px); }
}

.btn-next {
    display: inline-block;
    margin-top: 56px;
    padding: 12px 44px;
    background: transparent;
    color: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-size: 13px; font-family: inherit;
    letter-spacing: 0.3em; text-indent: 0.3em;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
    opacity: 0;
    animation: optIn 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.2s forwards;
}
.text-input-wrap .btn-next { margin-top: 0; }
.btn-next::before {
    content: ''; position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
    animation: scanBtn 2.6s ease-in-out infinite;
}
@keyframes scanBtn {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
}
.btn-next:hover {
    background: var(--accent-soft);
    box-shadow: 0 0 26px var(--accent-soft);
    color: #ffffff;
}
.btn-next:disabled {
    opacity: 0.25; cursor: not-allowed; pointer-events: none;
    animation: none;
}

.welcome { text-align: left; width: 100%; }
.welcome .brand-line {
    font-size: 12px; color: var(--accent);
    letter-spacing: 0.4em; text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0; animation: charIn 0.7s ease 0.2s forwards;
}
.welcome h1 {
    font-size: 28px; font-weight: 500;
    margin-bottom: 40px; letter-spacing: 0.08em;
    opacity: 0; animation: charIn 0.7s ease 0.5s forwards;
}
.welcome p {
    font-size: 15px; line-height: 2.2;
    color: var(--text-muted); margin-bottom: 8px;
    opacity: 0; animation: charIn 0.7s ease forwards;
}
.welcome p:nth-of-type(1) { animation-delay: 0.85s; }
.welcome p:nth-of-type(2) { animation-delay: 1.15s; }
.welcome p:nth-of-type(3) { animation-delay: 1.45s; }
.welcome p:nth-of-type(4) { animation-delay: 1.75s; }
.welcome p:nth-of-type(5) { animation-delay: 2.05s; }
.welcome .btn-start {
    display: inline-block;
    margin-top: 48px;
    padding: 14px 50px;
    background: transparent;
    color: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-size: 13px; font-family: inherit;
    letter-spacing: 0.4em; text-indent: 0.4em;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
    opacity: 0; animation: charIn 0.7s ease 2.4s forwards;
}
.welcome .btn-start::before {
    content: ''; position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
    animation: scanBtn 3s ease-in-out infinite;
}
.welcome .btn-start:hover {
    background: var(--accent-soft);
    box-shadow: 0 0 32px var(--accent-soft);
    color: #ffffff;
}

#lie-overlay {
    position: fixed; inset: 0;
    z-index: 999;
    background: rgba(0, 0, 0, 0.75);
    display: none; align-items: center; justify-content: center;
    pointer-events: none;
    overflow: hidden;
}
#lie-overlay.show { display: flex; }
#lie-overlay .lie-text {
    font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
    font-size: 128px; font-weight: 900;
    color: #ff2020;
    letter-spacing: 0.18em; text-indent: 0.18em;
    position: relative;
    left: 0.5em;
    text-shadow:
        0 0 24px rgba(255, 30, 30, 0.95),
        0 0 60px rgba(255, 30, 30, 0.55),
        0 0 120px rgba(255, 30, 30, 0.35);
    opacity: 0; transform: scale(0.5); filter: blur(20px);
    animation: lieAppear 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
}
@keyframes lieAppear {
    0% { opacity: 0; transform: scale(0.5); filter: blur(20px); }
    50% { opacity: 1; transform: scale(1.12); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
}
#lie-overlay .lie-text.shake {
    animation: lieShake 0.32s ease-in-out infinite;
    opacity: 1;
    filter: none;
}
@keyframes lieShake {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(-3px, 2px) scale(1.01); }
    50% { transform: translate(3px, -2px) scale(0.99); }
    75% { transform: translate(-2px, -1px) scale(1.01); }
}
#lie-overlay .noise-flash {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg,
        rgba(255,255,255,0.1) 0px, transparent 2px, transparent 4px);
    opacity: 0; animation: noiseFlash 0.4s ease 0.1s;
    pointer-events: none;
}
@keyframes noiseFlash {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.6; }
}

#flash-overlay {
    position: fixed; inset: 0;
    background: #ffffff;
    opacity: 0; pointer-events: none; z-index: 1100;
    overflow: hidden;
}
#flash-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg,
        rgba(120, 180, 255, 0.7) 0px, transparent 2px, transparent 5px);
    opacity: 0;
}
#flash-overlay.flash { animation: flashAnim 0.4s ease; }
#flash-overlay.flash::before { animation: flashScanline 0.4s ease; }
@keyframes flashAnim {
    0% { opacity: 0; }
    8% { opacity: 1; }
    100% { opacity: 0; }
}
@keyframes flashScanline {
    0% { opacity: 0; transform: translateY(-8px); }
    10% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(8px); }
}

/* ========== 遮罩层：用于背景色过渡 ========== */
#transition-veil {
    position: fixed;
    inset: 0;
    background: #000000;
    opacity: 0;
    pointer-events: none;
    z-index: 1500;
    transition: opacity 1.0s ease;
}
#transition-veil.active {
    opacity: 1;
}

/* ========== 结果页整体退场 ========== */
.result-page.exiting {
    animation: pageExit 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
@keyframes pageExit {
    0% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
    100% {
        opacity: 0;
        transform: translateY(-30px) scale(0.94);
        filter: blur(8px);
    }
}

#wrong-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 20%, rgba(255, 0, 0, 0.5) 100%);
    opacity: 0; pointer-events: none; z-index: 850;
    overflow: hidden;
}
#wrong-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg,
        rgba(255, 80, 80, 0.55) 0px, transparent 2px, transparent 5px);
    opacity: 0;
}

            <polygon points="30,0 60,15 60,45 30,60 0,45 0,15" fill="none" stroke="rgba(120,180,255,0.6)" stroke-width="1"/>
            <polygon points="60,26 90,41 90,71 60,86 30,71 30,41" fill="none" stroke="rgba(120,180,255,0.3)" stroke-width="0.5"/>

    <span class="status-dot"></span>

    <div class="noise-flash"></div>
    <div class="lie-text">谎言！</div>

<!-- 过渡遮罩 -->
<div id="transition-veil"></div>

<script>
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   六边形旋转（JS 手动控制，速度平滑过渡）
   ============================================================ */
(function initHexRotation() {
    const hexBg = document.getElementById('hex-bg');
    if (!hexBg) return;

    // 各 phase 的目标旋转速度（度/秒）
    // 换算自原来的 CSS 动画时长：
    //   phase-1 : 60s/圈 → 6.0 度/秒
    //   phase-2 : 45s/圈 → 8.0 度/秒
    //   phase-3 : 35s/圈 → 10.3 度/秒
    //   phase-4 : 25s/圈 → 14.4 度/秒
    //   phase-5 : 18s/圈 → 20.0 度/秒
    //   phase-result : 60s/圈 → 6.0 度/秒
    const SPEED_BY_PHASE = {
        'phase-1': 6.0,
        'phase-2': 8.0,
        'phase-3': 10.3,
        'phase-4': 14.4,
        'phase-5': 20.0,
        'phase-result': 6.0
    };

    let angle = 0;              // 累积角度
    let currentSpeed = 6.0;     // 当前速度（度/秒）
    let targetSpeed = 6.0;      // 目标速度
    let lastTime = performance.now();

    // 监听 body.className 变化
    const observer = new MutationObserver(() => {
        const classes = document.body.className.split(/\s+/);
        for (const cls of classes) {
            if (SPEED_BY_PHASE[cls] !== undefined) {
                targetSpeed = SPEED_BY_PHASE[cls];
                break;
            }
        }
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);  // 单帧最大 100ms，防止切标签页回来跳变
        lastTime = now;

        // 速度平滑插值（大约 0.6 秒内到达目标速度）
        // 时间常数 0.6s：速度变化缓慢、不突兀
        currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, dt / 0.6);

        angle += currentSpeed * dt;
        if (angle >= 360) angle -= 360;

        hexBg.style.transform = `rotate(${angle}deg)`;

        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
})();

/* ============================================================
   音乐管理器

const MusicManager = (function() {
    const VOL_BGM = 0.5;
    const VOL_BGM_LOW = 0.15;
    const VOL_DWST = 0.5;
    const VOL_DWQ = 0.55;
    const FADE_NORMAL = 1500;
    const FADE_FAST = 1200;

    let bgm = null;
    let dwst = null;
    let dwq = null;
    let currentScene = null;
    let pauseTimers = { dwst: null, dwq: null };
    let fadeTimers = { bgm: null, dwst: null, dwq: null };

    function init() {
        if (bgm) return;
        bgm = new Audio('/music/exam-bgm.mp3');
        bgm.loop = true;
        bgm.volume = 0;

        dwst = new Audio('/music/exam-dwst.mp3');
        dwst.loop = true;
        dwst.volume = 0;

        dwq = new Audio('/music/exam-dwq.mp3');
        dwq.loop = true;
        dwq.volume = 0;
    }

    function fadeTo(audio, target, duration) {
        if (!audio) return;
        const key = audio === bgm ? 'bgm' : (audio === dwst ? 'dwst' : 'dwq');
        if (fadeTimers[key]) cancelAnimationFrame(fadeTimers[key]);

        const start = audio.volume;
        const delta = target - start;
        if (Math.abs(delta) < 0.001) {
            audio.volume = target;
            return;
        }
        const startTime = performance.now();

        function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const eased = t * t * (3 - 2 * t);
            audio.volume = Math.max(0, Math.min(1, start + delta * eased));
            if (t < 1) {
                fadeTimers[key] = requestAnimationFrame(step);
            } else {
                fadeTimers[key] = null;
            }
        }
        fadeTimers[key] = requestAnimationFrame(step);
    }

    function clearPauseTimers() {
        ['dwst', 'dwq'].forEach(k => {
            if (pauseTimers[k]) {
                clearTimeout(pauseTimers[k]);
                pauseTimers[k] = null;
            }
        });
    }

    function switchTo(scene) {
        if (currentScene === scene) return;
        currentScene = scene;
        init();
        clearPauseTimers();

        const needBgm = true;
        const needDwst = scene === 'dwst';
        const needDwq = scene === 'dwq';

        if (needBgm && bgm.paused) bgm.play().catch(() => {});
        if (needDwst && dwst.paused) dwst.play().catch(() => {});
        if (needDwq && dwq.paused) dwq.play().catch(() => {});

        let targetBgm = VOL_BGM;
        let targetDwst = 0;
        let targetDwq = 0;
        let duration = FADE_NORMAL;

        if (scene === 'dwst') {
            targetBgm = VOL_BGM_LOW;
            targetDwst = VOL_DWST;
        } else if (scene === 'dwq') {
            targetBgm = VOL_BGM_LOW;
            targetDwq = VOL_DWQ;
            duration = FADE_FAST;
        }

        fadeTo(bgm, targetBgm, duration);
        fadeTo(dwst, targetDwst, duration);
        fadeTo(dwq, targetDwq, duration);

        if (!needDwst) {
            pauseTimers.dwst = setTimeout(() => {
                if (currentScene === scene && dwst.volume < 0.01) {
                    dwst.pause();
                    dwst.currentTime = 0;
                }
            }, duration + 200);
        }
        if (!needDwq) {
            pauseTimers.dwq = setTimeout(() => {
                if (currentScene === scene && dwq.volume < 0.01) {
                    dwq.pause();
                    dwq.currentTime = 0;
                }
            }, duration + 200);
        }
    }

    function start() {
        init();
        currentScene = 'exam';
        bgm.volume = 0;
        bgm.play().catch(() => {});
        fadeTo(bgm, VOL_BGM, 2000);
    }

    // 结果页专用：更长、更柔的淡出
    function fadeOutAll(duration) {
        duration = duration === undefined ? 2400 : duration;
        clearPauseTimers();
        currentScene = null;
        if (bgm) fadeTo(bgm, 0, duration);
        if (dwst) fadeTo(dwst, 0, duration);
        if (dwq) fadeTo(dwq, 0, duration);
        setTimeout(() => {
            if (bgm) bgm.pause();
            if (dwst) dwst.pause();
            if (dwq) dwq.pause();
        }, duration + 300);
    }

    function stopAll() {
        clearPauseTimers();
        if (bgm) fadeTo(bgm, 0, 1500);
        if (dwst) fadeTo(dwst, 0, 1500);
        if (dwq) fadeTo(dwq, 0, 1500);
        setTimeout(() => {
            if (bgm) bgm.pause();
            if (dwst) dwst.pause();
            if (dwq) dwq.pause();
        }, 1700);
    }

    return { start, switchTo, stopAll, fadeOutAll };
})();

/* ============================================================

   ============================================================ */
const AudioEngine = (function() {
    let ctx = null;
    function init() {
        if (ctx) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            ctx = new AC();
        } catch (e) { console.warn('Web Audio 不可用'); }
    }
    function tone(freq, dur, type = 'sine', vol = 0.08, slide = null) {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    }
    function noise(dur = 0.3, vol = 0.05) {
        if (!ctx) return;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.2));
        }
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.value = vol;
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start();
    }
    return {
        init,
        click() { tone(880, 0.06, 'sine', 0.04); },
        select() { tone(1320, 0.1, 'sine', 0.05); },
        wrong() {
            tone(180, 0.4, 'sawtooth', 0.14, 60);
            tone(90, 0.55, 'square', 0.1);
            noise(0.5, 0.1);
            setTimeout(() => tone(45, 0.7, 'sawtooth', 0.12), 100);
        },
        lie() {
            tone(55, 1.4, 'sawtooth', 0.14);
            tone(80, 1.2, 'square', 0.08);
            noise(0.6, 0.1);
            setTimeout(() => noise(0.5, 0.08), 300);
        },
        transition() { tone(440, 0.8, 'sine', 0.03); setTimeout(() => tone(660, 0.6, 'sine', 0.03), 100); },
        submit() {
            tone(220, 2.0, 'sine', 0.06);
            setTimeout(() => tone(330, 1.8, 'sine', 0.05), 200);
            setTimeout(() => tone(440, 1.5, 'sine', 0.04), 400);
        },

        // ===== 结果页专用音效 =====
        // 卡片容器出现 —— 温暖低音
        cardAppear() {
            tone(220, 0.6, 'sine', 0.05);
            setTimeout(() => tone(330, 0.7, 'sine', 0.035), 120);
        },
        // 每段文字出现 —— 轻柔滴答
        textAppear() {
            tone(880, 0.06, 'sine', 0.018);
        },
        // 评估结果出现 —— 通过：上行；未通过：下行
        resultShow(passed) {
            if (passed) {
                tone(523, 0.5, 'sine', 0.055);          // C5
                setTimeout(() => tone(659, 0.55, 'sine', 0.05), 120);   // E5
                setTimeout(() => tone(784, 0.7, 'sine', 0.045), 240);   // G5
            } else {
                tone(220, 0.6, 'triangle', 0.06, 165);
                setTimeout(() => tone(155, 0.9, 'triangle', 0.05, 110), 250);
            }
        },
        // 卡片退场 —— 上行飘移
        cardExit() {
            tone(440, 0.5, 'sine', 0.03, 660);
            setTimeout(() => tone(660, 0.5, 'sine', 0.025, 880), 150);
        },
        // 光爆 —— 明亮上行
        lightBurst() {
            tone(1046, 0.4, 'sine', 0.06);
            setTimeout(() => tone(1318, 0.5, 'sine', 0.055), 100);
            setTimeout(() => tone(1568, 0.6, 'sine', 0.05), 200);
            setTimeout(() => tone(2093, 0.8, 'sine', 0.04), 320);
        }
    };
})();

/* ============================================================
   逐字动画
   ============================================================ */
function parseEmphasis(text) {
    const parts = [];
    let i = 0;
    while (i < text.length) {
        if (text[i] === '*' && text[i+1] === '*') {
            i += 2;
            while (i < text.length) {
                if (text[i] === '*' && text[i+1] === '*') {
                    i += 2;
                    break;
                }
                parts.push({ char: text[i], emph: true });
                i++;
            }
        } else {
            parts.push({ char: text[i], emph: false });
            i++;
        }
    }
    return parts;
}

async function typeText(el, text, mode = 'fade') {
    el.innerHTML = '';
    const displayText = resolveText(text);
    const parts = parseEmphasis(displayText);
    const delayStep = mode === 'step' ? 140 : mode === 'typing' ? 28 : 34;
    const isJitter = mode === 'distorted';

    parts.forEach((part, idx) => {
        if (part.char === ' ') {
            const sp = document.createElement('span');
            sp.className = 'char space';
            el.appendChild(sp);
            return;
        }
        const span = document.createElement('span');
        span.className = 'char'
            + (isJitter ? ' jitter-char' : '')
            + (part.emph ? ' emph' : '');
        span.textContent = part.char;
        span.style.animationDelay = (idx * delayStep) + 'ms';
        el.appendChild(span);
    });

    const singleDuration = isJitter ? 700 : 550;
    await wait(parts.length * delayStep + singleDuration + 100);
}

/* ============================================================
   主流程
   ============================================================ */
async function playQuestion() {
    if (currentIndex >= TOTAL) { await renderResult(); return; }
    isLocked = false;

    const q = QUESTIONS[currentIndex];
    const requiredPhase = 'phase-' + q.part;
    if (['q8', 'q9', 'q10', 'q11', 'q12'].includes(q.id)) {
        MusicManager.switchTo('dwst');
    } else if (q.id === 'q23') {
        MusicManager.switchTo('dwq');
    } else {
        MusicManager.switchTo('exam');
    }
    if (!document.body.classList.contains(requiredPhase)) {
        if (skipNextPhaseFlash) {
            skipNextPhaseFlash = false;
            document.body.className = requiredPhase;
        } else {
            setPhase(q.part, true);
            await wait(350);
        }
    }

    renderProgressRail();
    setStatus(`正在读取... ${String(currentIndex + 1).padStart(2, '0')} / ${TOTAL}`);

    const inner = document.getElementById('sceneInner');

    const prevQ = currentIndex > 0 ? QUESTIONS[currentIndex - 1] : null;
    const inPhotoFlow = prevQ
        && PHOTO_GROUP.includes(prevQ.id)
        && PHOTO_GROUP.includes(q.id);

    if (inPhotoFlow) {
        const textEl = inner.querySelector('.question-text');
        const optsContainer = inner.querySelector('.opts-container');

        textEl.innerHTML = '';
        textEl.style.transition = '';
        textEl.style.opacity = '';
        optsContainer.innerHTML = '';
        optsContainer.style.transition = '';
        optsContainer.style.opacity = '';
        optsContainer.classList.remove('show');

        void inner.offsetWidth;

        const displayText = resolveText(q.text);
        let animMode = 'fade';
        if (q.part === 4) animMode = 'distorted';
        await typeText(textEl, displayText, animMode);
        await wait(220);

        if (q.type === 'text') {
            renderTextInput(q, optsContainer);
        } else {
            renderOptions(q, optsContainer);
            bindSpecials(q);
        }

        requestAnimationFrame(() => {
            optsContainer.classList.add('show');
        });
        return;
    }

    resetSceneInner(inner);

    if (activeHexContainer) {
        activeHexContainer.remove();
        activeHexContainer = null;
    }

    const specialHTML = buildSpecials(q);

    let specialSlot = null;
    if (specialHTML && q.special !== 'hexagon-target') {
        specialSlot = document.createElement('div');
        specialSlot.className = 'special-slot';
        specialSlot.innerHTML = specialHTML;
        inner.appendChild(specialSlot);
    }

    if (q.special === 'hexagon-target') {
        activeHexContainer = document.createElement('div');
        activeHexContainer.id = 'hexContainer';
        activeHexContainer.className = 'hex-container';
        activeHexContainer.innerHTML = `
            <svg class="hex-svg-target" viewBox="0 0 100 100">
                <polygon class="hex-clickable" points="50,4 91,27 91,73 50,96 9,73 9,27" fill="transparent" stroke="rgba(220, 70, 70, 0.35)" stroke-width="0.7"/>
                <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="none" stroke="rgba(220, 70, 70, 0.18)" stroke-width="0.4"/>
            </svg>
            <div class="option hex-center-option" data-value="多维实体">
                <span class="opt-dot"></span>
                <span class="opt-label">多维实体</span>
            </div>
        `;
        inner.appendChild(activeHexContainer);

        activeHexContainer.querySelector('.hex-clickable').addEventListener('click', (e) => {
            if (activeHexContainer.classList.contains('activated')) return;
            activeHexContainer.classList.add('activated');
            AudioEngine.transition();
        });

        activeHexContainer.querySelector('.hex-center-option').addEventListener('click', (e) => {
            e.stopPropagation();
            if (isLocked) return;
            if (!activeHexContainer.classList.contains('activated')) return;

            const card = e.currentTarget;
            card.classList.add('selected');
            answers[q.id] = '多维实体';
            AudioEngine.select();

            setTimeout(() => {
                isLocked = true;
                if (q.afterAction) {
                    handleAfterAction(q);
                } else {
                    advance();
                }
            }, 700);
        });
    }

    const textEl = document.createElement('div');
    textEl.className = 'question-text';
    inner.appendChild(textEl);

    const optsContainer = document.createElement('div');
    optsContainer.className = 'opts-container';
    inner.appendChild(optsContainer);

    void inner.offsetWidth;

    if (specialSlot) {
        await wait(50);
        specialSlot.classList.add('show');
        let extraWait = 1000;
        if (q.special === 'photo') extraWait = 2400;
        else if (q.special === 'waveform') extraWait = 2200;
        else if (q.special === 'hexagon') extraWait = 1800;
        await wait(extraWait);
    }

    const displayText = resolveText(q.text);
    let animMode = 'fade';
    if (q.part === 3) animMode = 'typing';
    if (q.part === 4) animMode = 'distorted';
    if (q.part === 5) animMode = 'step';

    await typeText(textEl, displayText, animMode);
    await wait(220);

    if (q.type === 'text') {
        renderTextInput(q, optsContainer);
    } else {
        renderOptions(q, optsContainer);
        bindSpecials(q);
    }

    requestAnimationFrame(() => {
        inner.classList.add('pushed-up');
        optsContainer.classList.add('show');
        if (activeHexContainer) activeHexContainer.classList.add('show');
    });
}

function renderOptions(q, container) {
    const wrap = document.createElement('div');
    const isHexTarget = q.special === 'hexagon-target';
    wrap.className = 'options'
        + (q.type === 'multiple' ? ' multiple' : '')
        + (isHexTarget ? ' options-4x2' : '');
    wrap.id = 'optionsWrap';

    q.options.forEach((opt, i) => {
        const el = document.createElement('div');
        el.className = 'option';
        el.dataset.value = opt;
        el.style.animationDelay = (i * 70) + 'ms';
        el.innerHTML = `<span class="opt-dot"></span><span class="opt-label">${opt}</span>`;

        if (q.customOption === opt) {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'opt-custom-input';
            input.placeholder = '请填写';
            input.addEventListener('click', e => e.stopPropagation());
            el.appendChild(input);
            el.dataset.custom = 'true';
        }

        el.addEventListener('click', () => selectOption(el, q));
        wrap.appendChild(el);

        const enterDelay = i * 70 + 820;
        setTimeout(() => { el.dataset.entered = 'true'; }, enterDelay);
    });

    container.appendChild(wrap);

    if (q.type === 'multiple') {
        const btn = document.createElement('button');
        btn.className = 'btn-next';
        btn.id = 'btnNext';
        btn.textContent = '下 一 步';
        btn.disabled = true;
        btn.addEventListener('click', () => submitAnswer(q));
        container.appendChild(btn);
    }
}

function selectOption(el, q) {
    if (isLocked) return;
    AudioEngine.click();

    if (q.type === 'multiple') {
        el.classList.toggle('selected');
        const any = document.querySelectorAll('.option.selected').length > 0;
        const btn = document.getElementById('btnNext');
        if (btn) btn.disabled = !any;
        return;
    }

    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    AudioEngine.select();

    if (q.special === 'lie') {
        const value = el.dataset.custom
            ? (el.querySelector('.opt-custom-input').value.trim() || el.dataset.value)
            : el.dataset.value;
        answers[q.id] = value;
        setTimeout(() => triggerLie(), 300);
        return;
    }

    // 退出测试
    if (q.special === 'exit-exam' && el.dataset.value === q.exitOption) {
        setTimeout(() => exitExam(), 600);
        return;
    }

    const value = el.dataset.custom
        ? (el.querySelector('.opt-custom-input').value.trim() || el.dataset.value)
        : el.dataset.value;
    answers[q.id] = value;
    setTimeout(() => checkAndAdvance(q, el), 280);
}

function submitAnswer(q) {
    if (isLocked) return;
    isLocked = true;

    if (q.type === 'multiple') {
        const selectedEls = [...document.querySelectorAll('.option.selected')];
        const selected = selectedEls.map(o => o.dataset.value);
        answers[q.id] = selected;

        const ok = isAnswerCorrect(q);

        if (!ok) {
            AudioEngine.wrong();
            wrongFlash();
            selectedEls.forEach(el => el.classList.add('wrong'));

            setTimeout(() => {
                if (q.afterAction) {
                    handleAfterAction(q);
                } else {
                    advance();
                }
            }, 1000);
        } else {
            if (q.afterAction) {
                handleAfterAction(q);
            } else {
                advance();
            }
        }
    } else if (q.special === 'hexagon-target') {
        const selected = document.querySelector('.option.selected');
        if (selected) {
            answers[q.id] = selected.dataset.value;
            checkAndAdvance(q, selected);
        }
    }
}

function renderTextInput(q, container) {
    const wrap = document.createElement('div');
    wrap.className = 'text-input-wrap';
    wrap.innerHTML = `
        <input type="text" class="text-input" id="textAnswer"
               placeholder="请输入您的答案" autocomplete="off" spellcheck="false">
        <button class="btn-next" id="btnNext">确 认</button>
    `;
    container.appendChild(wrap);

    const input = document.getElementById('textAnswer');
    const btn = document.getElementById('btnNext');
    setTimeout(() => input.focus(), 500);

    const submit = () => {
        const val = input.value.trim();
        if (!val) return;
        answers[q.id] = val;
        checkTextAnswer(q, val, input);
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

function checkTextAnswer(q, val, inputEl) {
    if (isLocked) return;
    isLocked = true;

    if (!q.correct) { advance(); return; }

    const norm = val.toLowerCase().replace(/\s+/g, '');
    let ok;
    if (q.keywordMatch) {
        ok = q.correct.some(k => norm.includes(k.toLowerCase()));
    } else {
        ok = q.correct.some(k => norm === k.toLowerCase().replace(/\s+/g, ''));
    }

    if (!ok) {
        AudioEngine.wrong();
        wrongFlash();
        inputEl.classList.add('wrong');
        setTimeout(() => {
            inputEl.style.transition = 'opacity 0.4s ease';
            inputEl.style.opacity = '0';
        }, 600);
        setTimeout(() => { advance(); }, 1050);
    } else {
        advance();
    }
}

function checkAndAdvance(q, el) {
    if (!q.correct) {
        isLocked = true;
        if (q.afterAction) {
            handleAfterAction(q);
        } else {
            advance();
        }
        return;
    }

    const ok = isAnswerCorrect(q);

    if (!ok) {
        AudioEngine.wrong();
        wrongFlash();
        el.classList.add('wrong');

        if (q.forceCorrect) {
            isLocked = true;
            setTimeout(() => {
                el.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
                el.style.opacity = '0';
                el.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    el.style.visibility = 'hidden';
                    el.style.pointerEvents = 'none';
                    isLocked = false;
                }, 400);
            }, 600);
            return;
        }

        setTimeout(() => {
            el.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
            el.style.opacity = '0';
            el.style.transform = 'scale(0.9)';
        }, 600);

        isLocked = true;
        setTimeout(() => {
            if (q.afterAction) {
                handleAfterAction(q);
            } else {
                advance();
            }
        }, 1050);
    } else {
        isLocked = true;
        if (q.afterAction) {
            handleAfterAction(q);
        } else {
            advance();
        }
    }
}

async function handleAfterAction(q) {
    if (q.afterAction === 'lying') {
        const hasError = ['q5', 'q6', 'q7'].some(id => {
            const qq = QUESTIONS.find(x => x.id === id);
            return qq && !isAnswerCorrect(qq);
        });
        await showLyingAnimation(hasError ? '还在撒谎' : '你违背承诺');
    } else if (q.afterAction === 'not-love') {
        await showNotLoveAnimation();
    }
}

async function showLyingAnimation(text = '还在撒谎') {
    const overlay = document.createElement('div');
    overlay.className = 'lying-overlay';
    document.body.appendChild(overlay);

    const count = 140;

    for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'lying-text';
        span.textContent = text;

        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()) * 55;
        const cx = 50 + Math.cos(angle) * radius;
        const cy = 50 + Math.sin(angle) * radius;

        span.style.left = cx + '%';
        span.style.top = cy + '%';

        const size = 8 + Math.random() * 24;
        span.style.fontSize = size + 'px';

        const weightRoll = Math.random();
        span.style.fontWeight = weightRoll < 0.3 ? 300 : (weightRoll < 0.6 ? 700 : 900);

        span.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');

        const baseDelay = (i / count) * 4.5;
        const jitterDelay = Math.random() * 0.6;
        span.style.animationDelay = (baseDelay + jitterDelay) + 's';

        if (Math.random() < 0.3) span.classList.add('jitter');

        overlay.appendChild(span);
    }

    await wait(6000);

    flash();
    await wait(45);
    overlay.remove();

    currentIndex++;
    const inner = document.getElementById('sceneInner');
    inner.style.transition = 'none';
    inner.classList.remove('pushed-up', 'exiting');
    inner.innerHTML = '';
    void inner.offsetWidth;
    inner.style.transition = '';

    skipNextPhaseFlash = true;
    playQuestion();
}

async function showNotLoveAnimation() {
    const overlay = document.createElement('div');
    overlay.className = 'not-love-overlay';
    document.body.appendChild(overlay);

    const text = '你根本不了解她';
    const columnCount = 42;
    const centerIdx = Math.floor(columnCount / 2);

    for (let i = 0; i < columnCount; i++) {
        let size;
        if (i === centerIdx) {
            size = 62 + Math.random() * 6;
        } else {
            const roll = Math.random();
            if (roll < 0.13) {
                size = 22 + Math.random() * 18;
            } else {
                size = 5 + Math.random() * 12;
            }
        }

        const el = document.createElement('div');
        el.className = 'not-love-column';

        el.style.fontSize = size.toFixed(1) + 'px';
        el.style.left = (1 + i * (98 / (columnCount - 1))) + '%';

        const duration = 14 + Math.random() * 10;
        el.style.animationDuration = duration.toFixed(1) + 's';
        el.style.animationDelay = (-Math.random() * duration).toFixed(2) + 's';

        const alpha = 0.55 + Math.random() * 0.4;
        el.style.color = `rgba(220, 70, 70, ${alpha.toFixed(2)})`;

        const span = document.createElement('span');
        span.className = 'not-love-text';
        span.textContent = text;
        span.style.animationDelay = (0.5 + Math.random() * 7) + 's';
        el.appendChild(span);

        overlay.appendChild(el);
    }

    await wait(12000);

    flash();
    await wait(45);
    overlay.remove();

    currentIndex++;
    const inner = document.getElementById('sceneInner');
    inner.style.transition = 'none';
    inner.classList.remove('pushed-up', 'exiting');
    inner.innerHTML = '';
    void inner.offsetWidth;
    inner.style.transition = '';

    skipNextPhaseFlash = true;
    playQuestion();
}

// 退出测试：清空进度，返回桌面（和时光回溯一致）
async function exitExam() {
    isLocked = true;

    // 清空测试状态
    localStorage.removeItem('exam_answers');
    localStorage.removeItem('exam_passed');

    // 保留 ending_paths，清空 prologue_progress 的其他进度
    const preserved = {};
    try {
        const old = JSON.parse(localStorage.getItem('prologue_progress') || '{}');
        if (old.ending_paths) preserved.ending_paths = old.ending_paths;
    } catch {}
    localStorage.setItem('prologue_progress', JSON.stringify(preserved));

    // 黑幕淡入后跳转
    const veil = document.getElementById('transition-veil');
    veil.classList.add('active');
    await wait(1200);
    window.location.href = '../desktop/index-hanxiu.html';
}

async function advance() {
    if (isAdvancing) return;
    isAdvancing = true;
    isLocked = true;

    const prevQ = QUESTIONS[currentIndex];
    currentIndex++;
    const nextQ = currentIndex < TOTAL ? QUESTIONS[currentIndex] : null;

    const inPhotoFlow = nextQ
        && PHOTO_GROUP.includes(prevQ.id)
        && PHOTO_GROUP.includes(nextQ.id);

    if (inPhotoFlow) {
        const inner = document.getElementById('sceneInner');
        const textEl = inner.querySelector('.question-text');
        const optsContainer = inner.querySelector('.opts-container');
        if (textEl) {
            textEl.style.transition = 'opacity 0.35s ease';
            textEl.style.opacity = '0';
        }
        if (optsContainer) {
            optsContainer.style.transition = 'opacity 0.35s ease';
            optsContainer.style.opacity = '0';
        }
        await wait(360);
    } else {
        await clearScene();
    }

    isAdvancing = false;
    playQuestion();
}

async function triggerLie() {
    isLocked = true;
    AudioEngine.lie();
    wrongFlash();

    const overlay = document.getElementById('lie-overlay');
    const lieText = overlay.querySelector('.lie-text');
    lieText.classList.remove('shake');
    lieText.style.animation = 'none';
    void lieText.offsetWidth;
    lieText.style.animation = '';
    overlay.classList.add('show');

    await wait(550);
    lieText.classList.add('shake');

    await wait(2000);

    flash();
    await wait(45);

    overlay.classList.remove('show');
    lieText.classList.remove('shake');
    document.body.classList.remove('shake');

    currentIndex++;
    const inner = document.getElementById('sceneInner');
    inner.style.transition = 'none';
    inner.classList.remove('pushed-up', 'exiting');
    inner.innerHTML = '';
    void inner.offsetWidth;
    inner.style.transition = '';

    skipNextPhaseFlash = true;
    playQuestion();
}

function bindSpecials(q) {
    if (q.special === 'escape') {
        const wrap = document.getElementById('optionsWrap');
        if (!wrap) return;
        const target = wrap.querySelector(`[data-value="${q.escapeOption}"]`);
        if (!target) return;

        const initTimer = setTimeout(() => {
            target.style.animation = 'none';
            target.style.opacity = '1';
            target.style.transform = 'translate(0, 0)';
            target.dataset.entered = 'true';
        }, 1000);

        let offsetX = 0, offsetY = 0;
        let locked = false;
        let escaping = false;
        let mouseX = -10000, mouseY = -10000;

        const detectRange = 240;
        const resetRange = detectRange * 1.5;
        const boundX = 500, boundY = 260;

        const mouseHandler = (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        };
        document.addEventListener('mousemove', mouseHandler);

        const enterHandler = () => {
            if (locked) return;
            escaping = true;
        };
        target.addEventListener('mouseenter', enterHandler);

        const intervalId = setInterval(() => {
            if (locked) return;
            if (!escaping) return;
            if (mouseX < -9000) return;
            if (!target.isConnected) return;

            const rect = target.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = mouseX - cx;
            const dy = mouseY - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < detectRange) {
                const push = (detectRange - dist) / detectRange;
                const angle = Math.atan2(dy, dx);
                offsetX -= Math.cos(angle) * push * 32;
                offsetY -= Math.sin(angle) * push * 32;
            } else if (dist > resetRange) {
                offsetX *= 0.9;
                offsetY *= 0.9;
                if (Math.abs(offsetX) < 0.5) offsetX = 0;
                if (Math.abs(offsetY) < 0.5) offsetY = 0;
            }

            offsetX = Math.max(-boundX, Math.min(boundX, offsetX));
            offsetY = Math.max(-boundY, Math.min(boundY, offsetY));

            target.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        }, 40);

        const lockTimer = setTimeout(() => {
            locked = true;
            target.style.transition = 'all 0.7s cubic-bezier(0.25, 0.8, 0.25, 1)';
            target.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            target.style.borderColor = 'rgba(200, 60, 60, 0.7)';
            target.style.boxShadow = '0 0 28px rgba(200, 60, 60, 0.4)';
        }, 15000);

        const prevCleanup = escapeCleanup;
        escapeCleanup = () => {
            if (prevCleanup) prevCleanup();
            clearTimeout(initTimer);
            clearInterval(intervalId);
            clearTimeout(lockTimer);
            document.removeEventListener('mousemove', mouseHandler);
            target.removeEventListener('mouseenter', enterHandler);
        };
    }
}

// 把玩家答案格式化成可读文本
function formatWrongAnswer(val, q) {
    if (val === undefined || val === null) return '（未作答）';

    if (q.type === 'multiple') {
        if (!Array.isArray(val) || val.length === 0) return '（未选择）';
        return val.join('、');
    }

    if (typeof val === 'string' && val.trim() === '') return '（未填写）';
    return String(val);
}

// 转义 HTML 特殊字符
function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

/* ============================================================
   结果页
   ============================================================ */
async function renderResult() {
    localStorage.setItem('exam_answers', JSON.stringify(answers));

    let correctCount = 0, totalCorrect = 0;
    const wrongQuestions = [];   // ← 新增

    QUESTIONS.forEach(q => {
        if (!q.correct) return;
        totalCorrect++;

        const val = answers[q.id];
        let isCorrect = false;

        if (q.type === 'multiple') {
            if (Array.isArray(val)
                && val.length === q.correct.length
                && q.correct.every(c => val.includes(c))) {
                isCorrect = true;
            }
        } else if (Array.isArray(q.correct)) {
            if (q.keywordMatch) {
                const norm = (val || '').toLowerCase().replace(/\s+/g, '');
                if (q.correct.some(k => norm.includes(k.toLowerCase().replace(/\s+/g, '')))) isCorrect = true;
            } else {
                const norm = String(val).toLowerCase().replace(/\s+/g, '');
                if (q.correct.some(k => norm === k.toLowerCase().replace(/\s+/g, ''))) isCorrect = true;
            }
        } else {
            if (val === q.correct) isCorrect = true;
        }

        if (isCorrect) {
            correctCount++;
        } else {
            // 记录错题
            wrongQuestions.push({
                id: q.id,
                text: resolveText(q.text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'),
                answer: formatWrongAnswer(val, q)
            });
        }
    });
    const passed = correctCount === totalCorrect;

    localStorage.setItem('exam_passed', passed ? 'true' : 'false');

    // 记录第一次考试成绩（仅写一次）
    if (!localStorage.getItem('exam_first_result')) {
        localStorage.setItem('exam_first_result', passed ? 'true' : 'false');
    }

    AudioEngine.submit();
    document.body.className = passed ? 'phase-result' : 'phase-5';
    document.body.classList.add('result-mode');
    await wait(700);

    document.getElementById('progress-rail').innerHTML = '';
    setStatus('评估完成');

    const inner = document.getElementById('sceneInner');
    resetSceneInner(inner);

    const statusRow = passed
        ? `
            <div class="result-status">
                <span class="status-label">评估结果</span>
                <span class="status-bar"></span>
                <span class="pass">通 过</span>
            </div>
        `
        : `
            <div class="result-status">
                <span class="status-label">评估结果</span>
                <span class="status-bar"></span>
                <span class="fail">未 通 过</span>
            </div>
        `;

    const bodyText = passed
        ? `
            <p>韩休先生：</p>
            <p>本次「天启探索者计划」综合能力评估已完成。</p>
            <p>经系统核验，你的专业能力、认知模式与价值观匹配度均满足准入标准。</p>
            <p>面试安排将通过邮件另行通知。</p>
            ${statusRow}
        `
        : `
            <p>韩休先生：</p>
            <p>本次「天启探索者计划」综合能力评估已终止。</p>
            <p>经系统判定，核心维度匹配度未达准入阈值。</p>
            <p>本次测试记录已永久归档。</p>
            ${statusRow}
        `;

    const wrongHTML = wrongQuestions.length > 0
        ? `
            <div class="result-wrong">
                <div class="result-wrong-title">以下题目未能通过核验</div>
                <div class="result-wrong-list">
                    ${wrongQuestions.map(w => `
                        <div class="result-wrong-item">
                            <div class="result-wrong-q">${w.text}</div>
                            <div class="result-wrong-a">
                                <span class="wrong-label">你的答案</span>
                                <span class="wrong-value">${escapeHtml(w.answer)}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `
        : '';

    inner.innerHTML = `
        <div class="result-page ${passed ? 'passed' : 'failed'}" id="resultPage">
            <div class="result-brand">Tianqi Explorer Program</div>
            <h1>评 估 完 成</h1>
            <div class="result-body">
                ${bodyText}
            </div>
            ${wrongHTML}
            <div class="countdown-text">
                <span class="countdown-line"></span>
                <span>请按 <span class="continue-word">[ 任意处 ]</span> 继续</span>
                <span class="countdown-line"></span>
            </div>
            <div class="countdown-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    `;

    // ========== 音效时序 ==========
    setTimeout(() => AudioEngine.cardAppear(), 900);
    setTimeout(() => AudioEngine.textAppear(), 1200);
    setTimeout(() => AudioEngine.textAppear(), 1500);
    setTimeout(() => AudioEngine.textAppear(), 1800);
    setTimeout(() => AudioEngine.textAppear(), 2100);
    setTimeout(() => AudioEngine.resultShow(passed), 3900);

    // ========== 音乐淡出（缓慢，5 秒）==========
    MusicManager.fadeOutAll(5000);

    // ========== 等待玩家点击 ==========
    let canContinue = false;
    setTimeout(() => {
        canContinue = true;
        document.body.classList.add('can-continue');
    }, 5500);

    const continueHandler = async (e) => {
        if (!canContinue) return;

        // 点击评估卡片或错题区内部时，不跳转（防止误触）
        if (e && e.type === 'click' &&
            (e.target.closest('.result-body') || e.target.closest('.result-wrong'))) {
            return;
        }

        document.removeEventListener('click', continueHandler);
        document.removeEventListener('keydown', continueHandler);
        document.body.classList.remove('can-continue');

        // 1. 卡片退场
        const resultPage = document.getElementById('resultPage');
        if (resultPage) {
            resultPage.classList.add('exiting');
            AudioEngine.cardExit();
        }

        // 2. 等待卡片退场动画
        await wait(900);

        // 3. 黑幕淡入
        const veil = document.getElementById('transition-veil');
        veil.classList.add('active');

        // 4. 黑幕完全覆盖后跳转
        await wait(1200);
        window.location.href = '../ending/e3funeral.html';
    };

    setTimeout(() => {
        document.addEventListener('click', continueHandler);
        document.addEventListener('keydown', continueHandler);
    }, 5500);
}
