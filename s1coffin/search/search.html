<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coocle 搜索</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #202124;
            --text-secondary: #5f6368;
            --text-muted: #9aa0a6;
            --link: #1a0dab;
            --link-visited: #660099;
            --border: #dfe1e5;
            --btn-bg: #f8f9fa;
            --btn-hover: #f1f3f4;
            --accent: #4285f4;
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font);
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== 顶部导航 ========== */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 18px;
            padding: 14px 28px;
            font-size: 14px;
            position: relative;
            z-index: 10;
        }
        .top-nav a {
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .top-nav a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* ========== 首页视图 ========== */
        .home-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 120px;
        }

        .home-logo {
            font-size: 4.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            cursor: pointer;
            user-select: none;
        }
        .home-logo span:nth-child(1) { color: #4285f4; }
        .home-logo span:nth-child(2) { color: #ea4335; }
        .home-logo span:nth-child(3) { color: #fbbc05; }
        .home-logo span:nth-child(4) { color: #4285f4; }
        .home-logo span:nth-child(5) { color: #34a853; }
        .home-logo span:nth-child(6) { color: #ea4335; }

        .search-box {
            width: 100%;
            max-width: 580px;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
            transition: box-shadow 0.2s, border-color 0.2s;
            margin-bottom: 24px;
        }
        .search-box:focus {
            border-color: #4285f4;
            box-shadow: 0 1px 8px rgba(66,133,244,0.25);
        }

        .search-buttons {
            display: flex;
            gap: 12px;
        }
        .search-btn {
            padding: 10px 20px;
            font-size: 14px;
            background: var(--btn-bg);
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            color: #3c4043;
            transition: background 0.2s, border-color 0.2s;
        }
        .search-btn:hover {
            background: var(--btn-hover);
            border-color: #dadce0;
        }

        /* ========== 搜索结果视图 ========== */
        .results-view {
            flex: 1;
            display: none;
            padding: 20px 28px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }
        .results-view.active {
            display: block;
        }

        .results-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .results-logo {
            font-size: 2rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }
        .results-logo span:nth-child(1) { color: #4285f4; }
        .results-logo span:nth-child(2) { color: #ea4335; }
        .results-logo span:nth-child(3) { color: #fbbc05; }
        .results-logo span:nth-child(4) { color: #4285f4; }
        .results-logo span:nth-child(5) { color: #34a853; }
        .results-logo span:nth-child(6) { color: #ea4335; }

        .results-search-box {
            flex: 1;
            padding: 12px 18px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 24px;
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .results-search-box:focus {
            border-color: #4285f4;
            box-shadow: 0 1px 6px rgba(66,133,244,0.2);
        }

        /* ========== 搜索结果条目 ========== */
        .result-item {
            margin-bottom: 28px;
            cursor: pointer;
        }
        .result-item .result-source {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 2px;
        }
        .result-item .result-url {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .result-item .result-title {
            font-size: 18px;
            color: var(--link);
            margin-bottom: 4px;
            transition: color 0.2s;
        }
        .result-item:hover .result-title {
            color: #1a0dab;
            text-decoration: underline;
        }
        .result-item .result-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .no-results {
            font-size: 15px;
            color: var(--text-secondary);
            padding: 40px 0;
            text-align: center;
        }

        /* ========== 通用隐藏 ========== */
        .hidden {
            display: none !important;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .home-logo {
                font-size: 3rem;
            }
            .search-box {
                max-width: 90%;
            }
            .results-top {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .results-logo {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="#" onclick="return false;">图片</a>
        <a href="#" onclick="return false;">地图</a>
    </div>

    <!-- 首页视图 -->
    <div class="home-view" id="homeView">
        <div class="home-logo" onclick="showHome()">
            <span>C</span><span>o</span><span>o</span><span>c</span><span>l</span><span>e</span>
        </div>
        <input type="text" class="search-box" id="homeSearchInput" placeholder="搜索网页" onkeydown="handleHomeKeyDown(event)">
        <div class="search-buttons">
            <button class="search-btn" onclick="performSearch('homeSearchInput')">Coocle 搜索</button>
            <button class="search-btn" onclick="window.location.href='#'">手气不错</button>
        </div>
    </div>

    <!-- 搜索结果视图 -->
    <div class="results-view" id="resultsView">
        <div class="results-top">
            <div class="results-logo" onclick="showHome()">
                <span>C</span><span>o</span><span>o</span><span>c</span><span>l</span><span>e</span>
            </div>
            <input type="text" class="results-search-box" id="resultsSearchInput" placeholder="搜索网页" onkeydown="handleResultsKeyDown(event)">
        </div>
        <div id="searchResultsList"></div>
    </div>

    <script src="search-data.js"></script>
    <script>
        // ========== 辅助函数 ==========
        function showHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('resultsView').classList.remove('active');
            document.getElementById('homeSearchInput').focus();
        }

        function showResults(query) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('resultsView').classList.add('active');
            document.getElementById('resultsSearchInput').value = query;
            renderSearchResults(query);
        }

        function handleHomeKeyDown(e) {
            if (e.key === 'Enter') {
                performSearch('homeSearchInput');
            }
        }

        function handleResultsKeyDown(e) {
            if (e.key === 'Enter') {
                performSearch('resultsSearchInput');
            }
        }

        function performSearch(inputId) {
            const input = document.getElementById(inputId);
            const query = input.value
                .trim()
                .replace(/[\s\u3000]+/g, '')   // 去掉首尾和中间的所有空格（含全角）
                .toLowerCase();
            if (!query) return;
            showResults(query);
        }

        // ========== 搜索与排序 ==========
        function renderSearchResults(query) {
            const container = document.getElementById('searchResultsList');

            // 过滤匹配结果
            const results = searchDatabase.filter(item => {
                // 如果标记为隐藏，直接跳过
                if (item.hidden) return false;
                return item.keywords.some(k => {
                    const keyword = k.toLowerCase();
                    if (item.fuzzy) {
                        // 模糊匹配：互相包含
                        return keyword.includes(query) || query.includes(keyword);
                    } else {
                        // 精确匹配：完全相等
                        return keyword === query;
                    }
                });
            });

            if (results.length === 0) {
                container.innerHTML = `<div class="no-results">未找到与"${query}"相关的结果。请尝试其他关键词。</div>`;
                return;
            }

            // 按 priority 分组（1~5），同一优先级内随机排序
            const groups = {};
            results.forEach(item => {
                const p = item.priority || 5;
                if (!groups[p]) groups[p] = [];
                groups[p].push(item);
            });

            const sortedResults = [];
            Object.keys(groups)
                .map(Number)
                .sort((a, b) => a - b)
                .forEach(p => {
                    const shuffled = groups[p].sort(() => Math.random() - 0.5);
                    sortedResults.push(...shuffled);
                });

            // 渲染
            let html = '';
            sortedResults.forEach(item => {
                html += `
                    <div class="result-item" onclick="window.open('${item.target}', '_blank')">
                        <div class="result-source">${item.source}</div>
                        <div class="result-url">${item.url}</div>
                        <div class="result-title">${item.title}</div>
                        <div class="result-desc">${item.desc}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ========== 初始化 ==========
        showHome();
    </script>
</body>
</html>
