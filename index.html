<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多维实体：空棺</title>
    <style>
        :root {
            --bg: #060a1c;
            --text: #d0d0e0;
            --text-dim: #70708a;
            --accent: #0071e3;
            --accent-glow: #00c8ff;
            --font-serif: 'Source Han Serif SC', 'Source Han Serif CN', 'Noto Serif SC', 'Songti SC', 'STZhongsong', Georgia, serif;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: 17px;
            line-height: 2.15;
            letter-spacing: 0.04em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* ========== 背景光晕层 ========== */
        .glow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(
                    ellipse 1100px 650px at 50% 50%,
                    rgba(0, 45, 95, 0.55) 0%,
                    rgba(0, 30, 70, 0.25) 40%,
                    transparent 70%
                );
            opacity: 0;
            transition: opacity 2.4s ease;
        }
        .glow-layer.visible {
            opacity: 1;
        }

        /* ========== 粒子层 ========== */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(140, 170, 220, 0.5);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            50% { transform: translateY(50vh) translateX(20px) rotate(180deg); opacity: 0.8; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-10vh) translateX(-10px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ========== 背景六边形层 ========== */
        .hex-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .hex-layer.visible {
            opacity: 1;
        }
        .hex-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vmax;
            height: 100vmax;
            margin-top: -50vmax;
            margin-left: -50vmax;
            color: rgba(120, 180, 255, 0.55);
            transform-origin: center center;
            animation: hexExpand 16s linear infinite;
            animation-fill-mode: backwards;    /* 延迟期间应用 0% 关键帧（不可见） */
            will-change: transform, opacity;
        }
        .hex-shape svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .hex-shape polygon {
            fill: none;
            stroke: currentColor;
            stroke-width: 0.5;
            vector-effect: non-scaling-stroke;
        }
        @keyframes hexExpand {
            0%   { transform: scale(0.05); opacity: 0; }
            8%   { opacity: 0.5; }
            50%  { opacity: 0.35; }
            90%  { opacity: 0.05; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .hex-shape:nth-child(1) { animation-delay: -10s; }
        .hex-shape:nth-child(2) { animation-delay: -6s; }
        .hex-shape:nth-child(3) { animation-delay: -2s; }
        .hex-shape:nth-child(4) { animation-delay: 2s; }

        /* ========== 第一阶段：叙事文字 ========== */
        .narrative-container {
            position: relative;
            z-index: 10;
            max-width: 620px;
            margin: 0 auto;
            padding: 50px 44px 120px;
            text-align: center;
            opacity: 0;
            animation: containerFadeIn 0.8s ease 0.3s forwards;
            transition: opacity 0.8s ease;
        }
        .narrative-container.fade-out {
            opacity: 0;
        }
        @keyframes containerFadeIn {
            to { opacity: 1; }
        }

        /* ========== 章节标识（顶部） ========== */
        .chapter-mark {
            text-align: center;
            margin-bottom: 44px;
            opacity: 0;
            animation: fadeSlow 1.6s ease forwards;
        }
        .chapter-mark .title-hex {
            display: block;
            width: 32px;
            height: 36px;
            margin: 0 auto 20px;
            opacity: 0.55;
        }
        .chapter-mark .title-hex polygon {
            fill: none;
            stroke: #6a8fc8;
            stroke-width: 1;
        }
        .chapter-mark .title-hex .hex-inner {
            stroke: #4a6a98;
            stroke-width: 0.6;
            opacity: 0.5;
        }
        .chapter-mark .title-text {
            font-size: 12px;
            letter-spacing: 0.7em;
            color: #6a7898;
            padding-left: 0.7em;
            display: block;
        }
        @keyframes fadeSlow { to { opacity: 1; } }

        /* ========== 叙事文本 ========== */
        .narrative {
            text-align: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .narrative p {
            font-size: 17px;
            line-height: 2.15;
            color: var(--text);
            letter-spacing: 0.04em;
            margin-bottom: 42px;
            opacity: 0;
            transform: translateY(8px);
        }
        .narrative p:last-child {
            margin-bottom: 0;
        }

        .narrative p:nth-child(1) { animation: paragraphReveal 1.5s ease 1.2s forwards; }
        .narrative p:nth-child(2) { animation: paragraphReveal 1.5s ease 2.6s forwards; }
        .narrative p:nth-child(3) { animation: paragraphReveal 1.5s ease 4.1s forwards; }
        .narrative p:nth-child(4) { animation: paragraphReveal 1.5s ease 5.6s forwards; }
        .narrative p:nth-child(6) { animation: paragraphReveal 1.5s ease 8.6s forwards; }
        .narrative p:nth-child(8) { animation: paragraphReveal 1.5s ease 11.6s forwards; }
        .narrative p:nth-child(9) { animation: paragraphReveal 1.5s ease 13.1s forwards; }

        @keyframes paragraphReveal {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 高亮句（居中，上下横线） ========== */
        .bold-line {
            margin: 40px auto;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            transform: translateY(8px);
        }
        .bold-line:nth-child(5) { animation: paragraphReveal 1.5s ease 7.1s forwards; }
        .bold-line:nth-child(7) { animation: paragraphReveal 1.5s ease 10.1s forwards; }

        .bold-line .bold-text {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: #e8f0ff;
            letter-spacing: 0.15em;
            line-height: 1.95;
            padding-left: 0.15em;
            /* 加强的蓝光效果 */
            text-shadow:
                0 0 8px rgba(120, 200, 255, 0.85),
                0 0 22px rgba(0, 160, 255, 0.55),
                0 0 48px rgba(0, 113, 227, 0.35);
        }
        .bold-line .bold-marker,
        .bold-line .bold-marker-bottom {
            display: block;
            width: 0;
            height: 2px;
            /* 更深的蓝灰色，融入背景 */
            background: #2a4a6a;
            opacity: 0;
            margin: 0 auto;
            border-radius: 1px;
        }
        .bold-line .bold-marker { margin-bottom: 20px; }
        .bold-line .bold-marker-bottom { margin-top: 20px; }

        .bold-line:nth-child(5) .bold-marker,
        .bold-line:nth-child(5) .bold-marker-bottom {
            animation: markerExpand 1s cubic-bezier(0.22, 0.61, 0.36, 1) 8.6s forwards;
        }
        .bold-line:nth-child(7) .bold-marker,
        .bold-line:nth-child(7) .bold-marker-bottom {
            animation: markerExpand 1s cubic-bezier(0.22, 0.61, 0.36, 1) 11.6s forwards;
        }
        @keyframes markerExpand {
            from { width: 0; opacity: 0; }
            to   { width: 30px; opacity: 0.9; }
        }

        /* ========== 第一阶段按钮 ========== */
        .btn-container {
            margin-top: 60px;
            opacity: 0;
            animation: paragraphReveal 0.8s ease 14.4s forwards;
        }

        .btn-start {
            display: inline-block;
            padding: 14px 48px;
            font-size: 14px;
            font-family: var(--font-serif);
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--text);
            background: transparent;
            border: 1px solid rgba(0, 113, 227, 0.6);
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            padding-left: calc(48px + 0.2em);
        }
        .btn-start:hover {
            background: rgba(0, 113, 227, 0.15);
            border-color: var(--accent-glow);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(0, 113, 227, 0.3);
        }
        .btn-start::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 200, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        .btn-start:hover::after {
            width: 300px;
            height: 300px;
        }

        /* ========== 第二阶段：标题容器（保留黑体） ========== */
        .title-container {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            font-family: var(--font-sans);
        }
        .title-container.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .title-container.fade-out {
            opacity: 0;
            transition: opacity 0.9s ease;
        }
        .title-container.visible {
            cursor: pointer;
        }

        .title-inner {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-family: var(--font-sans);
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.05;
            color: var(--text);
            text-shadow:
                0 0 20px rgba(0, 113, 227, 0.5),
                0 0 60px rgba(0, 200, 255, 0.3),
                0 0 120px rgba(0, 113, 227, 0.2);
            opacity: 0;
            animation: titleReveal 1.2s ease forwards;
            animation-play-state: paused;
        }

        .title-container.visible .game-title {
            animation-play-state: running;
        }
        @keyframes titleReveal {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ========== 英文副标题（逐字浮现） ========== */
        .game-subtitle {
            font-family: var(--font-sans); 
            text-align: center;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2.2em;
            color: #697286;
            margin-top: 18px;
            padding-left: 2.2em;
            user-select: none;
            text-shadow: 0 0 20px rgba(0, 113, 227, 0.35);
        }

        .game-subtitle .sub-char {
            display: inline-block;
            opacity: 0;
            will-change: opacity, filter, transform;
            animation: subtitleCharIn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            /* 初始暂停，等标题容器出现后才播放 */
            animation-play-state: paused;
        }

        .title-container.visible .game-subtitle .sub-char {
            animation-play-state: running;
        }

        @keyframes subtitleCharIn {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: translateY(20px) scale(0.7);
            }
            60% {
                opacity: 1;
                filter: blur(2px);
                transform: translateY(-4px) scale(1.05);
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0) scale(1);
            }
        }

        /* ========== 系列标识 ========== */
        .series-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-top: 26px;
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            color: #e0e8ff;
            letter-spacing: 0.5em;
            user-select: none;
        }

        .series-mark .mark-line {
            display: inline-block;
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #90a0c0 50%, transparent);
            opacity: 0;
            transform: scaleX(0);
            will-change: transform, opacity;
        }

        .series-mark .mark-line:first-child {
            transform-origin: right center;
            animation: markLineExpand 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 1.6s forwards;
            animation-play-state: paused;
        }

        .series-mark .mark-line:last-child {
            transform-origin: left center;
            animation: markLineExpand 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 1.6s forwards;
            animation-play-state: paused;
        }

        .title-container.visible .series-mark .mark-line {
            animation-play-state: running;
        }

        @keyframes markLineExpand {
            from {
                transform: scaleX(0);
                opacity: 0;
            }
            to {
                transform: scaleX(1);
                opacity: 0.75;
            }
        }

        .series-mark .mark-text {
            display: inline-block;
            padding-left: 0.5em;
            opacity: 0;
            /* 三层蓝光，和英文标题的光晕同源 */
            text-shadow:
                0 0 8px rgba(120, 200, 255, 0.75),
                0 0 20px rgba(0, 160, 255, 0.45),
                0 0 40px rgba(0, 113, 227, 0.25);
            animation: markTextReveal 1.2s ease 1.9s forwards;
            animation-play-state: paused;
        }

        .title-container.visible .series-mark .mark-text {
            animation-play-state: running;
        }

        @keyframes markTextReveal {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 点击提示 ========== */
        .click-hint {
            font-family: var(--font-sans);
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            color: var(--text-dim);
            opacity: 0;
            animation: hintReveal 1.2s ease 2.4s forwards;
            white-space: nowrap;
            user-select: none;
        }
        .click-hint .bracket {
            color: var(--accent-glow);
            font-weight: 500;
        }
        @keyframes hintReveal {
            from { opacity: 0; transform: translateX(-50%) translateY(6px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .click-hint .bracket {
            animation: bracketPulse 2s ease-in-out 3.5s infinite;
            display: inline-block;
        }
        @keyframes bracketPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        /* ========== 设备提示 ========== */
        .device-hint {
            font-family: var(--font-sans);
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            color: var(--text-dim);
            opacity: 0;
            animation: hintReveal 1.2s ease 3.2s forwards;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(120, 150, 200, 0.15);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 150, 200, 0.35);
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 680px) {
            body { font-size: 16px; line-height: 2; }
            .narrative-container { padding: 40px 26px; }
            .narrative p { margin-bottom: 32px; font-size: 16px; }
            .bold-line .bold-text { font-size: 17px; }
            .game-title { font-size: 2.6rem; }
            .click-hint {
                font-size: 0.75rem;
                letter-spacing: 0.15em;
            }
        }
    </style>
</head>
<body>

    <!-- 背景光晕 -->
    <div class="glow-layer" id="glowLayer"></div>

    <!-- 背景粒子 -->
    <div class="particles" id="particles"></div>

    <!-- 背景六边形（仅第二阶段显示） -->
    <div class="hex-layer" id="hexLayer">
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
        <div class="hex-shape">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <polygon points="50,2 93,25 93,75 50,98 7,75 7,25" />
            </svg>
        </div>
    </div>

    <!-- 第一阶段：叙事文字 -->
    <div class="narrative-container" id="narrativeContainer">

        <!-- 顶部章节标识 -->
        <div class="chapter-mark">
            <svg class="title-hex" viewBox="0 0 32 36" xmlns="http://www.w3.org/2000/svg">
                <polygon points="16,1 31,10 31,26 16,35 1,26 1,10"/>
                <polygon class="hex-inner" points="16,6 26,12 26,24 16,30 6,24 6,12"/>
            </svg>
            <span class="title-text">开 始</span>
        </div>

        <div class="narrative">
            <p>你叫韩休，一名高中物理老师</p>

            <p>一个月前，你的妻子丁文倩赴国外执行公务<br>你本以为，那不过又是一次寻常的出差</p>

            <p>三天前，你的生日<br>你在办公室里赶评职称的材料</p>

            <p>敲门声响起<br>一位自称你妻子任职的公司人<br>他告诉你</p>

            <div class="bold-line">
                <span class="bold-marker"></span>
                <span class="bold-text">丁文倩在执行任务中意外身亡</span>
                <span class="bold-marker-bottom"></span>
            </div>

            <p>没有解释，没有细节，没有原因<br>你想追问，对方只留下一句</p>

            <div class="bold-line">
                <span class="bold-marker"></span>
                <span class="bold-text">请尽快查收邮件，让丁教授安息</span>
                <span class="bold-marker-bottom"></span>
            </div>

            <p>今天，你坐在电脑前<br>屏幕的光标在黑暗中静静闪烁</p>

            <p>你该点哪里？</p>
        </div>

        <div class="btn-container">
            <button class="btn-start" id="btnStart">开 始 游 戏</button>
        </div>
    </div>

    <!-- 第二阶段：标题 -->
    <div class="title-container" id="titleContainer">
        <div class="title-inner">
            <h1 class="game-title">多维实体</h1>
            <p class="game-subtitle">Dimension</p>
            <div class="series-mark">
                <span class="mark-line"></span>
                <span class="mark-text">空 棺</span>
                <span class="mark-line"></span>
            </div>
        </div>
        <div class="click-hint">
            点击 <span class="bracket">[ 任意处 ]</span> 开始游戏
        </div>
        <div class="device-hint">建议用电脑游玩，分辨率不低于 1920 × 1080</div>
    </div>

<script>
/* ============================================================
   背景光晕淡入
   ============================================================ */
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('glowLayer').classList.add('visible');
    }, 300);

    // 如果玩家已经开始过游戏，跳过动画，直接显示全部文案
    if (localStorage.getItem('game_started') === 'true') {
        // 让容器和所有文字都立即显示（无动画）
        narrativeContainer.style.animation = 'none';
        narrativeContainer.style.opacity = '1';

        const paragraphs = narrativeContainer.querySelectorAll('.narrative p, .bold-line');
        paragraphs.forEach(el => {
            el.style.animation = 'none';
            el.style.opacity = '1';
            el.style.transform = 'none';
        });

        // 高亮句的两条横线也直接展开
        narrativeContainer.querySelectorAll('.bold-marker, .bold-marker-bottom').forEach(el => {
            el.style.animation = 'none';
            el.style.width = '30px';
            el.style.opacity = '0.9';
        });

        // 按钮直接显示
        const btnContainer = narrativeContainer.querySelector('.btn-container');
        if (btnContainer) {
            btnContainer.style.animation = 'none';
            btnContainer.style.opacity = '1';
        }
    }
});

/* ============================================================
   背景粒子
   ============================================================ */
(function initParticles() {
    const container = document.getElementById('particles');
    const count = 60;
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        const dur = 12 + Math.random() * 14;
        p.style.animationDuration = dur + 's';
        p.style.animationDelay = (-Math.random() * dur) + 's';
        const size = (1 + Math.random() * 2).toFixed(1) + 'px';
        p.style.width = size;
        p.style.height = size;
        p.style.opacity = (0.3 + Math.random() * 0.4).toFixed(2);
        container.appendChild(p);
    }
})();

/* ============================================================
   音效
   ============================================================ */
const openingAudio = new Audio('music/opening.mp3');
openingAudio.volume = 1;
openingAudio.loop = false;

/* ============================================================
   英文副标题逐字拆分
   ============================================================ */
(function initSubtitle() {
    const el = document.querySelector('.game-subtitle');
    if (!el) return;
    const text = el.textContent.trim();
    el.textContent = '';
    [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'sub-char';
        span.textContent = ch;
        // 相对标题容器出现的时刻：中文标题入场 1.2s，英文错后 0.5s 开始
        // 每个字母错开 80ms
        span.style.animationDelay = (0.5 + i * 0.08) + 's';
        el.appendChild(span);
    });
})();

/* ============================================================
   第一阶段：开始游戏
   ============================================================ */
const btnStart = document.getElementById('btnStart');
const narrativeContainer = document.getElementById('narrativeContainer');
const titleContainer = document.getElementById('titleContainer');
const hexLayer = document.getElementById('hexLayer');

let enteredTitleStage = false;

btnStart.addEventListener('click', function() {
    localStorage.setItem('game_started', 'true');

    setTimeout(() => {
        openingAudio.currentTime = 0;
        openingAudio.play().catch(() => {});
    }, 400);

    narrativeContainer.classList.add('fade-out');

    setTimeout(() => {
        narrativeContainer.style.display = 'none';
        hexLayer.classList.add('visible');
        titleContainer.classList.add('visible');
        enteredTitleStage = true;
    }, 800);
});

/* ============================================================
   第二阶段：点击任意地方进入游戏
   ============================================================ */
titleContainer.addEventListener('click', function() {
    if (!enteredTitleStage) return;

    enteredTitleStage = false;
    titleContainer.style.pointerEvents = 'none';

    titleContainer.classList.add('fade-out');

    setTimeout(() => {
        window.location.href = 'desktop/index-hanxiu.html';
    }, 950);
});
</script>
