<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频播放器</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="audio-style.css">
</head>
<body>

    <div class="audio-player">
        <!-- 标题 -->
        <div class="audio-title" id="audioTitle">🎵 录音文件</div>

        <!-- 波形区域 -->
        <div class="waveform-area">
            <canvas id="waveformCanvas"></canvas>
            <div class="subtitle-overlay" id="subtitleOverlay"></div>
        </div>

        <!-- 进度条 -->
        <div class="progress-row">
            <span class="time-display" id="currentTime">00:00</span>
            <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1">
            <span class="time-display" id="totalTime">00:00</span>
        </div>

        <!-- 控制按钮 -->
        <div class="controls-row">
            <button class="ctrl-btn" id="btnRewind" title="回到开头">
                <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 3.5v9a.5.5 0 0 1-.8.4L8 8.8a.5.5 0 0 1 0-.8l5.2-4.1a.5.5 0 0 1 .8.4z" />
                    <path d="M7 3.5v9a.5.5 0 0 1-.8.4L1 8.8a.5.5 0 0 1 0-.8L6.2 3.1a.5.5 0 0 1 .8.4z" />
                </svg>
            </button>
            <button class="ctrl-btn play-btn" id="btnPlay" title="播放">
                <svg id="playIcon" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.5 3.2a.5.5 0 0 1 .76-.43l8 4.8a.5.5 0 0 1 0 .86l-8 4.8a.5.5 0 0 1-.76-.43V3.2z" />
                </svg>
                <svg id="pauseIcon" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                    <rect x="4" y="3" width="2.5" height="10" rx="0.5" />
                    <rect x="9.5" y="3" width="2.5" height="10" rx="0.5" />
                </svg>
            </button>
            <button class="ctrl-btn" id="btnForward" title="跳到结尾">
                <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 3.5v9a.5.5 0 0 0 .8.4l5.2-4.1a.5.5 0 0 0 0-.8L2.8 3.1a.5.5 0 0 0-.8.4z" />
                    <path d="M9 3.5v9a.5.5 0 0 0 .8.4l5.2-4.1a.5.5 0 0 0 0-.8L9.8 3.1a.5.5 0 0 0-.8.4z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- 隐藏的 audio 元素 -->
    <audio id="audioElement" preload="metadata"></audio>

    <script src="audio-script.js"></script>
</body>
</html>
