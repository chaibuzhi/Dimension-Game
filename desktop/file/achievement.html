<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解锁成就</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #f3f3f3;
        color: #1a1a1a;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        display: flex;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    /* ========== 左侧边栏 ========== */
    .sidebar {
        width: 200px;
        flex-shrink: 0;
        background: #f3f3f3;
        padding: 20px 10px 16px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #ebebeb;
        overflow-y: auto;
    }

    .sidebar-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: #8a8a8a;
        padding-left: 12px;
        margin-bottom: 10px;
        text-transform: uppercase;
    }

    .nav {
        display: flex;
        flex-direction: column;
        gap: 1px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 5px;
        font-size: 13px;
        color: #2a2a2a;
        cursor: pointer;
        position: relative;
        transition: background 0.12s;
        user-select: none;
    }

    .nav-item:hover {
        background: #eaeaea;
    }

    .nav-item.active {
        background: #e8e8e8;
        font-weight: 500;
    }

    .nav-item.active::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 16px;
        background: #0067c0;
        border-radius: 2px;
    }

    .nav-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: #4a4a4a;
        transition: color 0.12s;
    }

    .nav-item.active .nav-icon {
        color: #0067c0;
    }

    /* 侧栏底部统计 */
    .sidebar-footer {
        margin-top: auto;
        padding: 14px 12px 0;
        border-top: 1px solid #e0e0e0;
        font-size: 11.5px;
        color: #8a8a8a;
        letter-spacing: 0.02em;
    }

    .stat-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 3px 0;
    }

    .stat-value {
        color: #0067c0;
        font-weight: 600;
    }

    /* ========== 右侧内容区 ========== */
    .content {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 32px 40px 40px;
    }

    .content-inner {
        max-width: 640px;
        margin: 0 auto;
    }

    .page-title {
        font-size: 22px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 6px;
    }

    .page-sub {
        font-size: 13px;
        color: #8a8a8a;
        letter-spacing: 0.04em;
        margin-bottom: 28px;
    }

    /* 占位块 */
    .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px;
        background: #ffffff;
        border: 1px solid #ebebeb;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        text-align: center;
    }

    .placeholder-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 20px;
        color: #c0c0c0;
    }

    .placeholder-title {
        font-size: 16px;
        font-weight: 500;
        color: #3a3a3a;
        margin-bottom: 8px;
    }

    .placeholder-desc {
        font-size: 13px;
        color: #8a8a8a;
        line-height: 1.8;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
        width: 6px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.25);
    }
</style>
</head>
<body>

    <!-- 左侧导航 -->
    <aside class="sidebar">
        <div class="sidebar-title">成就</div>

        <nav class="nav" id="nav">
            <div class="nav-item active" data-tab="main">
                <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 13.5h11"/>
                    <path d="M4 13.5V6.5l4-4 4 4v7"/>
                    <path d="M6.5 13.5v-3h3v3"/>
                </svg>
                主线成就
            </div>
            <div class="nav-item" data-tab="explore">
                <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="8" cy="8" r="6"/>
                    <path d="M10.5 5.5l-1.2 3.3-3.3 1.2 1.2-3.3z"/>
                </svg>
                探索成就
            </div>
            <div class="nav-item" data-tab="ending">
                <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="8,1.5 10,5.5 14.5,6 11.2,9 12,13.5 8,11.5 4,13.5 4.8,9 1.5,6 6,5.5"/>
                </svg>
                结局成就
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="stat-line">
                <span>已解锁</span>
                <span class="stat-value" id="statUnlocked">0 / 0</span>
            </div>
        </div>
    </aside>

    <!-- 右侧内容 -->
    <main class="content">
        <div class="content-inner">
            <h1 class="page-title" id="pageTitle">主线成就</h1>
            <p class="page-sub" id="pageSub">Main Story</p>

            <div class="placeholder">
                <svg class="placeholder-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="24,6 30,16 42,18 33,27 35,39 24,33 13,39 15,27 6,18 18,16"/>
                </svg>
                <div class="placeholder-title">功能开发中</div>
                <div class="placeholder-desc">敬请期待</div>
            </div>
        </div>
    </main>

<script>
    (function() {
        // ========== 标签元数据 ==========
        const TAB_META = {
            main:    { title: '主线成就', sub: 'Main Story' },
            explore: { title: '探索成就', sub: 'Exploration' },
            ending:  { title: '结局成就', sub: 'Endings' }
        };

        const navItems = document.querySelectorAll('.nav-item');
        const pageTitle = document.getElementById('pageTitle');
        const pageSub = document.getElementById('pageSub');

        // ========== 切换标签 ==========
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                if (!TAB_META[tab]) return;

                // 更新导航激活态
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');

                // 更新右侧标题
                pageTitle.textContent = TAB_META[tab].title;
                pageSub.textContent = TAB_META[tab].sub;

                // 未来：根据 tab 渲染不同成就列表
            });
        });

        // ========== 占位统计（未来接入真实数据） ==========
        // 数据源预期：
        //   - 结局成就：localStorage.endings_unlocked（对象 {end01: true, ...}）
        //   - 主线成就：待定义
        //   - 探索成就：待定义
    })();
</script>
</body>
</html>
